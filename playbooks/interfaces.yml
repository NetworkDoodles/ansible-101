---
# Chapters 4 and 5 · Interfaces from data.
#
# Each switch's ports are listed in host_vars/<switch>.yml. One task loops over that list, so adding a
# port is a change to data, never to the playbook.
- name: Interfaces
  hosts: fabric
  gather_facts: false

  tasks:
    - name: Description and admin state, one port at a time
      nokia.srlinux.config:
        update:
          - path: "/interface[name={{ item.name }}]"
            value:
              description: "{{ item.description }}"
              admin-state: enable
      loop: "{{ interfaces }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Jumbo MTU on uplinks only
      nokia.srlinux.config:
        update:
          - path: "/interface[name={{ item.name }}]"
            value:
              mtu: 9100
      loop: "{{ interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.uplink | default(false)
