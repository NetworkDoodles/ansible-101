---
# Task 8.2 · A playbook someone wrote years ago. It works; ansible-lint has opinions.
- name: Show what each switch is running
  hosts: fabric
  gather_facts: false

  tasks:
    - name: Read the software version
      nokia.srlinux.get:
        paths:
          - path: /system/information/version
            datastore: state
      register: version

    - name: Show it
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ version.result[0] }}"
