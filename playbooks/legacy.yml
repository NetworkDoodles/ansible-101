---
# Task 8.2 · A playbook someone wrote years ago. It works; ansible-lint has opinions.
- name: Show what each switch is running
  hosts: fabric
  gather_facts: false

  tasks:
    - name: Ask for the software version
      cisco.ios.ios_command:
        commands:
          - show version
      register: version

    - name: Show it
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ version.stdout_lines[0][0] }}"
