---
# Chapters 3 and 5 · The base config every switch gets: NTP and where it lives.
#
# Nothing in here names a switch. The values come from inventory/group_vars/fabric.yml and
# inventory/host_vars/<switch>.yml, so one play configures every switch differently.
#
#   make run T=3.1        then        make check T=3.1
- name: Base config
  hosts: fabric
  gather_facts: false

  tasks:
    - name: NTP servers, from group_vars
      cisco.ios.ios_ntp_global:
        config:
          servers: "{{ ntp_servers }}"

    - name: Where the switch lives, from host_vars
      cisco.ios.ios_config:
        lines:
          - "snmp-server location {{ location }}"

    # TODO 5.1a  (follow along) The NTP task: notify a handler that saves the running config.
    # TODO 5.1c  (challenge) The location task notifies it too.

  # TODO 5.1b  (follow along) A handlers section with one handler, "Save the running config", that runs
  #            `write memory` with cisco.ios.ios_command.
