---
# Chapters 3 and 5 · The base config every switch gets: NTP and where it lives.
#
# Nothing in here is specific to one switch. The values come from group_vars/fabric.yml and
# host_vars/<switch>.yml, so the same play configures every switch differently.
- name: Base config
  hosts: fabric
  gather_facts: false

  tasks:
    - name: NTP servers, from group_vars
      nokia.srlinux.config:
        update:
          - path: /system/ntp
            value:
              admin-state: enable
              network-instance: mgmt
              server: "{{ ntp_servers }}"
      notify: Save the running config

    - name: Where the switch lives, from host_vars
      nokia.srlinux.config:
        update:
          - path: /system/information
            value:
              location: "{{ location }}"
      notify: Save the running config

  handlers:
    - name: Save the running config
      nokia.srlinux.cli:
        commands:
          - save startup
