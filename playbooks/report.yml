---
# Task 4.2 · A report from a template.
#
# The first play asks every switch for its version; the second renders one file from all of them.
- name: Ask every switch
  hosts: fabric
  gather_facts: false

  tasks:
    - name: Gather the switch's facts
      cisco.ios.ios_facts:
        gather_subset: min

    - name: Keep the version
      ansible.builtin.set_fact:
        sw_version: "{{ ansible_facts.net_version }}"

- name: Write the report
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Render build/fabric-report.md
      ansible.builtin.template:
        src: fabric-report.md.j2      # Ansible looks in playbooks/templates/ for you
        dest: "{{ playbook_dir }}/../build/fabric-report.md"
        mode: "0644"
