---
# Task 3.2 · Ask each switch about itself, keep the answer, write it down.
#
# `register` saves a task's result in a variable; `set_fact` picks out the parts you want.
- name: What the switches say about themselves
  hosts: fabric
  gather_facts: false

  tasks:
    - name: Read system information and the chassis
      nokia.srlinux.get:
        paths:
          - path: /system/information
            datastore: state
          - path: /platform/chassis
            datastore: state
      register: info

    - name: Keep the two facts we care about
      ansible.builtin.set_fact:
        sw_version: "{{ info.result[0].version }}"
        sw_serial: "{{ info.result[1]['serial-number'] }}"

    - name: Show them
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} runs {{ sw_version }}, serial {{ sw_serial }}"

    - name: Make sure build/facts/ exists (once, on this machine)
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../build/facts"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Write them to build/facts/<switch>.yml
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../build/facts/{{ inventory_hostname }}.yml"
        content: "{{ {'version': sw_version, 'serial': sw_serial} | to_nice_yaml }}"
        mode: "0644"
      delegate_to: localhost
