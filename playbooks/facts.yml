---
# Task 3.2 · Ask each switch about itself, keep the answer, write it down.
#
# A facts module asks the switch about itself, and its answers land in ansible_facts (net_version, net_serialnum ...).
# `set_fact` makes new variables of your own from them.
#
#   make run T=3.2        then        make check T=3.2
- name: What the switches say about themselves
  hosts: fabric
  gather_facts: false

  tasks:
    - name: Gather the switch's facts
      cisco.ios.ios_facts:
        gather_subset: min

    - name: Keep the two facts we care about
      ansible.builtin.set_fact:
        sw_version: "{{ ansible_facts.net_version }}"
        sw_serial: "{{ ansible_facts.net_serialnum }}"

    - name: Show them
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} runs {{ sw_version }}, serial {{ sw_serial }}"

    - name: Make sure build/facts/ exists (once, on this machine)
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../build/facts"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Write them to build/facts/<switch>.yml
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../build/facts/{{ inventory_hostname }}.yml"
        content: "{{ {'version': sw_version, 'serial': sw_serial} | to_nice_yaml }}"
        mode: "0644"
      delegate_to: localhost
