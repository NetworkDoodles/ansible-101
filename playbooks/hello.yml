---
# Chapter 2 · Your first playbook.
#
# A playbook is a list of plays. A play says which hosts, then lists tasks. A task calls one module.
#
#   make run T=2.1        then        make check T=2.1
- name: Hello, fabric
  hosts: fabric
  gather_facts: false

  tasks:
    - name: Who to call
      cisco.ios.ios_config:
        lines:
          - snmp-server contact netops@networkdoodles.com

    - name: Login banner
      cisco.ios.ios_banner:
        banner: login
        text: "Managed by Ansible - Network Doodles lab"
        state: present

    - name: The domain the switches live in
      cisco.ios.ios_config:
        lines:
          - ip domain name lab.networkdoodles.com

    - name: LLDP, so each switch learns its neighbors
      cisco.ios.ios_config:
        lines:
          - lldp run
