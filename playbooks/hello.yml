---
# Chapter 2 · Your first playbook.
#
# A playbook is a list of plays. A play says which hosts, then lists tasks. A task calls one module.
#
#   make run T=2.1        then        make check T=2.1
- name: Hello, fabric
  hosts: fabric
  gather_facts: false

  tasks:
    - name: Login banner
      nokia.srlinux.config:
        update:
          - path: /system/banner
            value:
              login-banner: "Managed by Ansible · Network Doodles lab"

    - name: Who to call
      nokia.srlinux.config:
        update:
          - path: /system/information
            value:
              contact: netops@networkdoodles.com

    - name: The domain the switches live in
      nokia.srlinux.config:
        update:
          - path: /system/name
            value:
              domain-name: lab.networkdoodles.com

    - name: Timezone
      nokia.srlinux.config:
        update:
          - path: /system/clock
            value:
              timezone: America/New_York
