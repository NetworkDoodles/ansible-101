---
# Each switch's ports, from host_vars/<switch>.yml.
- name: Description and no shutdown
  cisco.ios.ios_interfaces:
    config:
      - name: "{{ item.name }}"
        description: "{{ item.description }}"
        enabled: true
  loop: "{{ interfaces }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [descriptions]

- name: Jumbo MTU on uplinks only
  cisco.ios.ios_interfaces:
    config:
      - name: "{{ item.name }}"
        mtu: 9100
  loop: "{{ interfaces }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.uplink | default(false)
  tags: [mtu]
