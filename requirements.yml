---
# Ansible collections the lab uses (chapter 6 explains this file). The dev container installs them;
# elsewhere: ansible-galaxy collection install -r requirements.yml
collections:
  - name: cisco.ios            # the modules for the switches' CLI: ios_command, ios_config, ios_facts ...
    version: 11.6.0
  - name: ansible.netcommon    # how Ansible holds an SSH session to a network device (network_cli)
    version: 8.7.1
  - name: ansible.utils
    version: 6.1.1
