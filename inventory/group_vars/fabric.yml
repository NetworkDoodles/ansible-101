---
# Everything every switch in the fabric shares. Ansible loads this for every host in the `fabric` group.

# How to talk to the switches: an SSH session to their CLI, driven by the cisco.ios modules.
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.ios.ios
ansible_user: admin
ansible_password: "{{ vault_ansible_password }}"   # from inventory/group_vars/all/vault.yml

# Read-only SNMP community, encrypted on its own line with ansible-vault encrypt_string: the rest of
# the file stays readable in a diff.
snmp_community: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          66383430653433353434623339646165323662353563666433656536636265656363663036313434
          6664613762633965386332643232366336346632386135340a643662343635646137616537353532
          33306363313861373066333064643661383535633463616435623835663434666364626662333864
          3035363631363339320a303165363237343362633961623433353935623939386663633334636137
          6538

# Facts about the fabric that the playbooks turn into config. Shaped the way the ios_ntp_global module
# wants them (a list of servers, each with a `server`), so the playbook can hand it over as it is.
ntp_servers:
  - server: 162.159.200.1
  - server: 162.159.200.123
