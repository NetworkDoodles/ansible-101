---
# Everything every switch in the fabric shares. Ansible loads this for every host in the `fabric` group.

# How to talk to the switches: an SSH session to their CLI, driven by the cisco.ios modules.
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.ios.ios
ansible_user: admin
ansible_password: capeos-lab

# Facts about the fabric that the playbooks turn into config. Shaped the way the ios_ntp_global module
# wants them (a list of servers, each with a `server`), so the playbook can hand it over as it is.
ntp_servers:
  - server: 162.159.200.1
  - server: 162.159.200.123
