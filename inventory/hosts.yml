---
# Task 1.2 · The inventory: which switches exist and how they're grouped.
#
# Ansible reads this file (ansible.cfg points at it). Groups can hold hosts and other groups.
#
#   ansible-inventory --graph        then        make check T=1.2
all:
  children:
    fabric:
      children:
        spines:
          hosts:
            spine1:
        leaves:
          hosts:
            leaf1:
            leaf2:
      vars:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: nokia.srlinux.srlinux
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: false
        ansible_user: admin
        ansible_password: NokiaSrl1!
