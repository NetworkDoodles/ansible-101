---
# Task 1.2 · The inventory: which switches exist and how they're grouped.
#
# Ansible reads this file (ansible.cfg points at it). Groups can hold hosts and other groups.
#
#   ansible-inventory --graph        then        make check T=1.2
all:
  children:
    fabric:
      children:
        spines:
          hosts:
            spine1:
        leaves:
          hosts:
            leaf1:
            leaf2:
      vars:
        # How to talk to the switches: an SSH session to their CLI, driven by the cisco.ios modules.
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_user: admin
        ansible_password: capeos-lab
