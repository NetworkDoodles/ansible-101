---
# Task 8.3 · The lab's pipeline. GitLab's runners can't reach the switches on your machine, so CI
# checks everything it can without them: YAML style, Ansible lint, and that every playbook parses.
# The starter on main in the upstream lab repo has open TODOs by design, so skip it there; it runs on
# the solution branch and in your fork.
workflow:
  rules:
    - if: $CI_COMMIT_TAG                     # the solution-chN tags are snapshots, not branches to test
      when: never
    - if: $CI_PROJECT_PATH == "networkdoodles-labs/ansible-101" && $CI_COMMIT_BRANCH == "main"
      when: never
    - when: always

variables:
  # GitLab checks the repo out into a world-writable folder, and Ansible won't read ansible.cfg from one.
  # Naming it explicitly makes every job use it (the inventory, the roles path, the vault settings).
  ANSIBLE_CONFIG: $CI_PROJECT_DIR/ansible.cfg

# GitLab refuses a pipeline file with no jobs at all. This one never runs: it just keeps the file valid
# until you add yours. Leave it.
placeholder:
  script: ["true"]
  rules:
    - when: never

default:
  image: python:3.13-slim
  before_script:
    # Chapter 7 points ansible.cfg at .vault-pass, which is never committed. In your own project, set
    # VAULT_PASSWORD as a masked CI/CD variable. Lint and syntax checks never decrypt anything, so without
    # it a placeholder is enough.
    - echo "${VAULT_PASSWORD:-not-needed-for-lint}" > .vault-pass
    - pip install -q -r requirements.txt
    - ansible-galaxy collection install -r requirements.yml > /dev/null

lint:
  script:
    - yamllint .
    - ansible-lint --offline

syntax:
  script:
    - ansible-playbook playbooks/site.yml --syntax-check
