---
# Chapter 8 · The lab's execution environment (EE): a container image with ansible-core, the collections
# the lab uses and their Python dependencies. `make ee` builds it with ansible-builder.
# fedora-minimal is multi-arch, so it builds natively on Apple Silicon and on x86.
version: 3
images:
  base_image:
    name: quay.io/fedora/fedora-minimal:43
dependencies:
  python_interpreter:
    package_system: python3
    python_path: /usr/bin/python3
  ansible_core:
    package_pip: ansible-core==2.20.1
  ansible_runner:
    package_pip: ansible-runner==2.4.3
  # network_cli's SSH library, the same one requirements.txt installs in the venv.
  python:
    - ansible-pylibssh==1.4.0
  galaxy: requirements.yml
options:
  package_manager_path: /usr/bin/dnf5
