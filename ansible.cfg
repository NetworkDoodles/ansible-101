# Ansible's settings for the lab. Ansible reads ansible.cfg from the folder you run it in, except when that
# folder is world-writable (Codespaces' is), so the dev container and the Makefile also point
# ANSIBLE_CONFIG at this file.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# The switches' SSH keys are new every time the lab starts, and they use lab-only passwords; never do
# either of these in production.
host_key_checking = False
# Readable output: one YAML block per result instead of a wall of JSON.
callback_result_format = yaml
# No retry files littering the repo.
retry_files_enabled = False
interpreter_python = auto_silent

[persistent_connection]
# network_cli holds one SSH session per switch for the whole play, with libssh (ansible-pylibssh, from
# requirements.txt). Naming it here saves Ansible guessing, and a warning on every run.
ssh_type = libssh
command_timeout = 60
