# Ansible's settings for the lab. Ansible reads ansible.cfg from the folder you run it in, except when that
# folder is world-writable (Codespaces' is), so the dev container and the Makefile also point
# ANSIBLE_CONFIG at this file.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# The switches use self-signed certificates and lab-only passwords; never do either of these in production.
host_key_checking = False
# Readable output: one YAML block per result instead of a wall of JSON.
callback_result_format = yaml
# No retry files littering the repo.
retry_files_enabled = False
interpreter_python = auto_silent
# nokia.srlinux 1.1.1 imports a helper ansible-core plans to remove, and every run would say so. It's the
# collection's to fix, not yours, so the lab hides deprecation warnings. Turn this back on when you upgrade.
deprecation_warnings = False

[persistent_connection]
command_timeout = 60
