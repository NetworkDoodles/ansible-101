---
# Chapter 8 · ansible-navigator runs every playbook inside the EE instead of the venv.
ansible-navigator:
  mode: stdout
  execution-environment:
    image: ans101-ee:1
    pull:
      policy: never            # built locally by `make ee`, never pulled
    # The EE is a container too: it joins the switches' management network so `leaf1` resolves.
    container-options: ["--network=ans101-mgmt"]
  playbook-artifact:
    enable: false
  logging:
    level: warning
    file: build/ansible-navigator.log
