---
# Chapter 8 · ansible-navigator runs every playbook inside the EE instead of the venv.
ansible-navigator:
  mode: stdout
  execution-environment:
    image: ans101-ee:1
    pull:
      policy: never            # built locally by `make ee`, never pulled
    # TODO 8.1b  The EE is a container on its own network, so it can't see the switches. Join it to
    #            theirs: container-options: ["--network=ans101-mgmt"]
  playbook-artifact:
    enable: false
  logging:
    level: warning
    file: build/ansible-navigator.log
